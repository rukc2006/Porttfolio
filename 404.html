<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Секунду…</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; background:#f7f6f4; color:#26242a;
         font:300 16px/1.6 'Jost', system-ui, sans-serif; text-align:center; }
  .box { max-width: 430px; padding: 28px; }
  h1 { font:400 22px/1.3 'Cormorant Garamond', Georgia, serif; margin:0 0 12px; }
  a { color:#26242a; }
</style>
</head>
<body>
<div class="box">
  <h1>Открываю страницу</h1>
  <p id="msg">Содержимое портфолио лежит в пакетах — подключаю их.</p>
  <p><a href="./">Вернуться на витрину</a></p>
</div>
<script>
/* Прямая ссылка внутрь проекта, открытая до того, как браузер
   подключил раздатчик. Подключаем и повторяем заход — один раз,
   чтобы не зациклиться, если страницы и правда нет.

   Где лежит sw.js, страница не знает: адрес зависит от того, как
   назван репозиторий. Пробуем два обычных случая — сайт проекта
   (адрес вида /Имя-репозитория/) и сайт целиком в корне. */
(function () {
  var once = "portfolio-404-retry";
  var msg = document.getElementById("msg");
  if (!("serviceWorker" in navigator)) {
    msg.textContent = "Браузер не поддерживает офлайн-раздачу содержимого.";
    return;
  }
  if (sessionStorage.getItem(once) === location.pathname) {
    msg.textContent = "Такой страницы в портфолио нет.";
    return;
  }

  var parts = location.pathname.split("/").filter(Boolean);
  var tries = ["/sw.js"];
  if (parts.length > 1) tries.unshift("/" + parts[0] + "/sw.js");

  (function next(i) {
    if (i >= tries.length) {
      msg.textContent = "Не нашла раздатчик содержимого рядом с сайтом.";
      return;
    }
    navigator.serviceWorker.register(tries[i]).then(function () {
      return navigator.serviceWorker.ready;
    }).then(function () {
      sessionStorage.setItem(once, location.pathname);
      location.reload();
    }).catch(function () { next(i + 1); });
  })(0);
})();
</script>
</body>
</html>
