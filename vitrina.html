<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Витрина — Мастерская-Колыбель</title>
<style>
:root{--bg:#0d140e;--bg2:#111a12;--fg:#eee9dc;--muted:#a9a493;--line:#30382f;--accent:#b89a57}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{max-width:1120px;margin:auto;padding:0 28px}.top{display:flex;justify-content:space-between;align-items:center;padding:28px 0 22px;border-bottom:1px solid var(--line);gap:20px}.back{color:var(--muted);font-size:14px}.theme{border:1px solid var(--line);border-radius:999px;padding:10px 15px;color:var(--muted);font-size:13px;background:transparent;cursor:pointer}.eyebrow{margin-top:80px;color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:12px}.title{font-family:Georgia,serif;font-size:clamp(54px,8vw,100px);font-weight:400;line-height:.95;margin:22px 0}.intro{color:var(--muted);font-size:18px;line-height:1.7;max-width:720px;margin-bottom:65px}.section-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding-bottom:90px}.section-card{display:block;position:relative;min-height:330px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);cursor:pointer}.section-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}.section-card:hover img{transform:scale(1.035)}.section-card:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(7,11,7,.9))}.section-card-copy{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:70px 24px 22px}.section-card h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(34px,5vw,58px);line-height:.98;margin:0 0 8px}.section-card p{margin:0;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.section-view{padding:45px 0 90px;border-top:1px solid var(--line)}.section-view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:32px}.section-view-head h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(42px,6vw,72px);line-height:.95;margin:0}.section-back{border:1px solid var(--line);padding:11px 15px;border-radius:999px;color:var(--muted);background:transparent;cursor:pointer;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.item{border:1px solid var(--line);background:#111a12;overflow:hidden;padding:0;width:100%;color:inherit;cursor:pointer;text-align:left;position:relative}.item img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;transition:transform .35s ease}.item:hover img{transform:scale(1.025)}.item:after{content:"";position:absolute;inset:auto 0 0;height:25%;background:linear-gradient(transparent,rgba(10,14,10,.55));pointer-events:none}.count-note{color:var(--muted);font-size:13px;margin:0}.empty{border:1px solid var(--line);padding:32px;color:var(--muted);line-height:1.7}.error{border-color:#5a4930}.light{background:#f3f0e7;color:#1b211b}.light .line,.light .section-view{border-color:#d5d0c2}.light .muted,.light .intro,.light .back,.light .theme{color:#666357}.light .section-card,.light .item{background:#fff;border-color:#d5d0c2}.light .section-card:after{background:linear-gradient(transparent,rgba(0,0,0,.62))}.light .item:after{background:linear-gradient(transparent,rgba(0,0,0,.2))}.light .section-card p{color:#e9e5da}.light .count-note{color:#666357}.light .section-back{color:#666357;border-color:#d5d0c2}
.lightbox{position:fixed;inset:0;background:rgba(5,8,5,.92);display:none;align-items:center;justify-content:center;padding:30px;z-index:20}.lightbox.open{display:flex}.lightbox img{max-width:min(1100px,94vw);max-height:88vh;object-fit:contain;box-shadow:0 20px 80px rgba(0,0,0,.45)}.lightbox-close{position:fixed;top:22px;right:28px;border:0;background:none;color:#eee9dc;font-size:42px;line-height:1;cursor:pointer}
@media(max-width:800px){.wrap{padding:0 18px}.top{padding:22px 0}.eyebrow{margin-top:55px}.intro{margin-bottom:45px}.section-list{grid-template-columns:1fr;padding-bottom:65px}.section-card{min-height:300px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section-view{padding:38px 0 65px}.section-view-head{align-items:flex-start;flex-direction:column}.section-back{order:-1}.title{font-size:58px}}
@media(max-width:520px){.title{font-size:52px}.section-card{min-height:260px}.section-card-copy{padding:60px 18px 18px}.section-card h2{font-size:40px}.grid{grid-template-columns:1fr}.lightbox{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="back" href="Kcradle.html">← Мастерская-Колыбель</a><button class="theme" id="theme" type="button">Светлая тема</button></header>
<main>
<div class="eyebrow">Витрина</div>
<h1 class="title">Работы Мастерской.</h1>
<p class="intro">Сначала — направления. Выберите то, что хочется рассмотреть. Внутри каждого раздела собраны работы, которые уже появились в мастерской.</p>
<div id="gallery"></div>
</main>
</div>
<script>
const gallery=document.getElementById('gallery');
const lightbox=document.createElement('div');lightbox.className='lightbox';lightbox.innerHTML='<button class="lightbox-close" type="button" aria-label="Закрыть">×</button><img alt="">';document.body.appendChild(lightbox);
const lightboxImg=lightbox.querySelector('img');
lightbox.addEventListener('click',e=>{if(e.target===lightbox||e.target.classList.contains('lightbox-close'))lightbox.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lightbox.classList.remove('open')});
const theme=document.getElementById('theme');
theme.onclick=()=>{document.body.classList.toggle('light');theme.textContent=document.body.classList.contains('light')?'Тёмная тема':'Светлая тема'};
let sections=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sectionIndexFromHash(){const m=location.hash.match(/^#section-(\d+)$/);return m?Number(m[1]):-1}
function showList(){
  if(!sections.length){gallery.innerHTML='<div class="empty">Витрина пока пуста.</div>';return}
  gallery.innerHTML='<div class="section-list">'+sections.map((s,i)=>{
    const cover=s.files&&s.files[0];
    return `<a class="section-card" href="#section-${i}">${cover?`<img loading="lazy" src="${esc(cover)}" alt="${esc(s.name)}">`:''}<div class="section-card-copy"><h2>${esc(s.name)}</h2><p>${(s.files||[]).length} ${plural((s.files||[]).length,['работа','работы','работ'])}</p></div></a>`;
  }).join('')+'</div>';
}
function showSection(i){
  const s=sections[i];
  if(!s){showList();return}
  gallery.innerHTML=`<section class="section-view"><div class="section-view-head"><div><h2>${esc(s.name)}</h2><p class="count-note">${s.files.length} ${plural(s.files.length,['работа','работы','работ'])}</p></div><button class="section-back" type="button" id="backToSections">← Все разделы</button></div><div class="grid">${s.files.map((src,j)=>`<button class="item" type="button" data-src="${esc(src)}" data-alt="${esc(s.name)} — работа ${j+1}"><img loading="lazy" src="${esc(src)}" alt="${esc(s.name)} — работа ${j+1}"></button>`).join('')}</div></section>`;
  document.getElementById('backToSections').addEventListener('click',()=>{history.pushState({},'',location.pathname+'?v=31');showList();window.scrollTo({top:0,behavior:'smooth'})});
  gallery.querySelectorAll('.item').forEach(btn=>btn.addEventListener('click',()=>{lightboxImg.src=btn.dataset.src;lightboxImg.alt=btn.dataset.alt;lightbox.classList.add('open')}));
}
function plural(n,forms){const m=n%100;if(m>=11&&m<=14)return forms[2];const x=n%10;return x===1?forms[0]:(x>=2&&x<=4?forms[1]:forms[2])}
window.addEventListener('hashchange',()=>{const i=sectionIndexFromHash();i>=0?showSection(i):showList()});
async function load(){
  const r=await fetch('works-cache/manifest.json?v=31',{cache:'no-store'});if(!r.ok)throw new Error('manifest '+r.status);
  const data=await r.json();sections=data.sections||[];
  const i=sectionIndexFromHash();i>=0?showSection(i):showList();
}
load().catch(e=>{console.error(e);gallery.innerHTML='<div class="empty error">Витрина временно не загрузилась. Попробуйте обновить страницу чуть позже.</div>'});
</script>
</body>
</html>
