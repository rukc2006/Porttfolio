<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Витрина — Мастерская-Колыбель</title>
<style>
:root{--bg:#0d140e;--fg:#eee9dc;--muted:#a9a493;--line:#30382f;--accent:#b89a57}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:0 28px}.top{display:flex;justify-content:space-between;align-items:center;padding:34px 0 26px;border-bottom:1px solid var(--line)}.back{color:var(--muted);font-size:14px}.theme{border:1px solid var(--line);border-radius:999px;padding:11px 16px;color:var(--muted);font-size:13px}.eyebrow{margin-top:90px;color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:12px}.title{font-family:Georgia,serif;font-size:clamp(54px,8vw,100px);font-weight:400;line-height:.95;margin:22px 0}.intro{color:var(--muted);font-size:18px;line-height:1.7;max-width:720px;margin-bottom:80px}.section{padding:70px 0;border-top:1px solid var(--line)}.section h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(36px,5vw,62px);margin:0 0 34px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.item{border:1px solid var(--line);background:#111a12;overflow:hidden;padding:0;width:100%;color:inherit;font:inherit;cursor:pointer;text-align:left}.item img{display:block;width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in}.item{display:block;position:relative}.item:after{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(transparent,rgba(10,14,10,.72));pointer-events:none}.empty{border:1px solid var(--line);padding:32px;color:var(--muted);line-height:1.7}.error{border-color:#5a4930}.light{background:#f3f0e7;color:#1b211b}.light .line,.light .section{border-color:#d5d0c2}.light .muted,.light .intro,.light .back,.light .theme{color:#666357}.light .item{background:#fff;border-color:#d5d0c2}@media(max-width:800px){.wrap{padding:0 18px}.top{padding:22px 0}.eyebrow{margin-top:55px}.intro{margin-bottom:50px}.section{padding:48px 0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.title{font-size:56px}.theme{display:none}}
.lightbox{position:fixed;inset:0;background:rgba(5,8,5,.9);display:none;align-items:center;justify-content:center;padding:30px;z-index:20}.lightbox.open{display:flex}.lightbox img{max-width:min(1100px,94vw);max-height:88vh;object-fit:contain;box-shadow:0 20px 80px rgba(0,0,0,.45)}.lightbox-close{position:fixed;top:22px;right:28px;border:0;background:none;color:#eee9dc;font-size:42px;line-height:1;cursor:pointer}@media(max-width:520px){.lightbox{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="back" href="Kcradle.html">← Мастерская-Колыбель</a><button class="theme" id="theme" type="button">Светлая тема</button></header>
<main>
<div class="eyebrow">Витрина</div>
<h1 class="title">Работы Мастерской.</h1>
<p class="intro">Здесь собраны работы, которые уже появились в мастерской. Можно просто смотреть, переходить от одного маленького мира к другому и возвращаться к тем, которые хочется рассмотреть внимательнее.</p>
<div id="gallery"></div>
</main>
</div>
<script>
const gallery=document.getElementById('gallery');
const lightbox=document.createElement('div'); lightbox.className='lightbox'; lightbox.innerHTML='<button class="lightbox-close" type="button" aria-label="Закрыть">×</button><img alt="">'; document.body.appendChild(lightbox); const lightboxImg=lightbox.querySelector('img'); lightbox.addEventListener('click',e=>{if(e.target===lightbox||e.target.classList.contains('lightbox-close')) lightbox.classList.remove('open')});
const theme=document.getElementById('theme');
const YANDEX_PUBLIC_KEY='https://disk.yandex.ru/d/hXwIR4kYK3endA';
const API='https://cloud-api.yandex.net/v1/disk/public/resources';
const IMG=/\.(png|jpe?g|webp|gif|avif)$/i;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path=''){
 const u=new URL(API);
 u.searchParams.set('public_key',YANDEX_PUBLIC_KEY);
 if(path) u.searchParams.set('path',path);
 u.searchParams.set('limit','1000');
 const r=await fetch(u.toString(),{cache:'no-store'});
 if(!r.ok) throw new Error('Yandex API '+r.status);
 return r.json();
}
async function collect(path='',sectionName=''){
 const d=await api(path);
 const items=(d._embedded&&d._embedded.items)||[];
 const files=[];
 const dirs=[];
 for(const x of items){
   if(x.type==='file' && IMG.test(x.name||'') && x.preview) files.push({name:x.name,src:x.preview});
   else if(x.type==='dir') dirs.push(x);
 }
 const sections=[];
 if(sectionName && files.length) sections.push({name:sectionName,files});
 for(const dir of dirs){
   const childPath=dir.path||((path?path+'/':'')+dir.name);
   const child=await collect(childPath,dir.name);
   sections.push(...child);
 }
 return sections;
}
function render(sections){
 if(!sections.length){gallery.innerHTML='<div class="empty">Витрина пока пуста.</div>';return}
 gallery.innerHTML=sections.map((s,si)=>`<section class="section" id="section-${si}"><h2>${esc(s.name)}</h2><div class="grid">${s.files.map((f,i)=>`<button class="item" type="button" data-src="${esc(f.src)}" data-alt="${esc(s.name)} — работа ${i+1}"><img loading="lazy" src="${esc(f.src)}" alt="${esc(s.name)} — работа ${i+1}"></button>`).join('')}</div></section>`).join('');
 gallery.querySelectorAll('.item').forEach(btn=>btn.addEventListener('click',()=>{lightboxImg.src=btn.dataset.src;lightboxImg.alt=btn.dataset.alt;lightbox.classList.add('open')}));
}
async function load(){
 try{const sections=await collect();render(sections)}catch(e){console.error(e);gallery.innerHTML='<div class="empty error">Витрина временно не загрузилась. Попробуйте обновить страницу чуть позже.</div>';}
}
theme.onclick=()=>{document.body.classList.toggle('light');theme.textContent=document.body.classList.contains('light')?'Тёмная тема':'Светлая тема'};
load();
</script>
</body>
</html>
