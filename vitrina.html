<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Витрина — Мастерская-Колыбель</title><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500&display=swap');:root{--bg:#101710;--bg2:#172018;--paper:#f1eadb;--muted:#b7ad98;--gold:#b69a68;--line:rgba(233,223,201,.18)}:root[data-theme="light"]{--bg:#eee8dc;--bg2:#e4ddce;--paper:#273126;--muted:#687063;--gold:#8a7040;--line:rgba(39,49,38,.18)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:300 15px/1.7 Manrope,system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 48px));margin:auto;padding:55px 0 90px}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.back{font-size:12px;color:var(--muted)}.theme-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}.theme-btn:hover{color:var(--paper);border-color:var(--gold)}h1{font:500 clamp(52px,7vw,88px)/.98 'Cormorant Garamond',serif;margin:70px 0 16px}.intro{max-width:780px;color:var(--muted);margin-bottom:50px}.section{margin-top:65px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:20px}.section-head h2{font:500 clamp(34px,4vw,52px)/1 'Cormorant Garamond',serif;margin:0}.section-head span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid var(--line);background:rgba(255,255,255,.02);overflow:hidden}.card img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}.caption{padding:15px;color:var(--muted);font-size:12px}.empty{border:1px solid var(--line);padding:30px;color:var(--muted)}.empty a{color:var(--gold)}.loading{border:1px solid var(--line);padding:40px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.wrap{width:min(100% - 28px,1180px)}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.section-head{align-items:flex-start;flex-direction:column}}</style><script>(function(){const k='kcradle-theme';function apply(m){document.documentElement.dataset.theme=m;const b=document.getElementById('themeBtn');if(b)b.textContent=m==='light'?'Тёмная тема':'Светлая тема'}function init(){let m='dark';try{m=localStorage.getItem(k)||'dark'}catch(e){}apply(m);const b=document.getElementById('themeBtn');if(b)b.onclick=()=>{m=m==='light'?'dark':'light';try{localStorage.setItem(k,m)}catch(e){}apply(m)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script></head><body><main class="wrap"><div class="top"><a class="back" href="Kcradle.html?v=18">← Мастерская-Колыбель</a><button id="themeBtn" class="theme-btn" type="button">Светлая тема</button></div><h1>Витрина работ</h1><p class="intro">Здесь собраны работы Мастерской-Колыбель.</p><div id="status" class="loading">Загружаю работы…</div><div id="sections"></div></main><script>
const CDN='https://cdn.jsdelivr.net/gh/rukc2006/Porttfolio@main/works/';
const IMG=/\.(png|jpe?g|webp|gif|avif)$/i;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nameOf(path){return decodeURIComponent(path.split('/').filter(Boolean).pop()||'').replace(/\.[^.]+$/,'').replace(/[-_]/g,' ')}
async function directory(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('CDN '+r.status);
  const html=await r.text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  return [...doc.querySelectorAll('a[href]')].map(a=>new URL(a.getAttribute('href'),url).href)
    .filter(u=>u.startsWith(url));
}
function section(name,files){
  const sec=document.createElement('section');sec.className='section';
  const head=document.createElement('div');head.className='section-head';
  head.innerHTML='<h2>'+esc(name)+'</h2><span>'+files.length+' работ</span>';
  const grid=document.createElement('div');grid.className='grid';
  files.forEach(u=>{const card=document.createElement('a');card.className='card';card.href=u;card.target='_blank';card.rel='noopener';
    const img=document.createElement('img');img.loading='lazy';img.src=u;img.alt=nameOf(u);
    const cap=document.createElement('div');cap.className='caption';cap.textContent=nameOf(u);card.append(img,cap);grid.append(card);
  });sec.append(head,grid);return sec;
}
async function load(){
  const status=document.getElementById('status'),out=document.getElementById('sections');
  const links=await directory(CDN);
  const files=links.filter(u=>IMG.test(u));
  const dirs=[...new Set(links.filter(u=>u.endsWith('/')))].filter(u=>u!==CDN).sort((a,b)=>a.localeCompare(b,'ru'));
  let count=0;
  if(files.length){out.append(section('Работы',files));count+=files.length}
  for(const d of dirs){try{const sub=(await directory(d)).filter(u=>IMG.test(u));if(sub.length){out.append(section(nameOf(d),sub));count+=sub.length}}catch(e){}}
  if(!count) throw new Error('empty');
  status.remove();
}
load().catch(()=>{document.getElementById('status').innerHTML='Пока здесь нет опубликованных работ.'});
</script></body></html>
