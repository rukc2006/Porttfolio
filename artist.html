<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102724"><meta name="description" content="Ксения Комарова — художественная практика, живопись и профессиональное CV."><link rel="canonical" href="https://rukc2006.github.io/Porttfolio/artist.html"><title>Ксения Комарова · Художница</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1d1b;color:#e7e6dc;font-family:Manrope,"Segoe UI",Arial,sans-serif}.panel{height:100%;width:100%}.panel[hidden]{display:none!important}iframe{display:block;width:100%;height:100%;border:0;background:#0c1d1b}</style></head><body>
<section class="panel" id="panel-view" title="Мой взгляд"><iframe title="Авторская презентация художницы" src="artist-view.html"></iframe></section>
<section class="panel" id="panel-cv" title="CV художницы" hidden><iframe title="CV художницы" data-src="artist-cv.html"></iframe></section>
<script>
const panels={view:document.getElementById('panel-view'),cv:document.getElementById('panel-cv')};
function selectTab(name,writeHash=true){if(!panels[name])return;Object.entries(panels).forEach(([key,p])=>p.hidden=key!==name);const frame=panels[name].querySelector('iframe');if(name==='cv'&&frame.getAttribute('src')===null){frame.addEventListener('load',()=>syncFrameLanguage(frame),{once:true});frame.setAttribute('src',frame.dataset.src)}else syncFrameLanguage(frame);if(writeHash)history.replaceState(null,'',location.pathname+location.search+(name==='cv'?'#cv':'#view'))}\nfunction syncFrameLanguage(frame){try{frame.contentWindow.postMessage({type:'kc-language-sync',lang:localStorage.getItem('kc_lang')||'ru'},location.origin)}catch(e){}}
window.addEventListener('message',event=>{if(event.origin!==location.origin||!event.data)return;if(event.data.type==='artist-tab-select')selectTab(event.data.name);if(event.data.type==='kc-language-change'){try{localStorage.setItem('kc_lang',event.data.lang)}catch(e){}}});window.addEventListener('hashchange',()=>{if(location.hash==='#cv')selectTab('cv',false);else if(location.hash==='#view')selectTab('view',false)});if(location.hash==='#cv')selectTab('cv',false);
</script></body></html>
