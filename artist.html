<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102724">
<meta name="description" content="Ксения Комарова — художественная практика, живопись и профессиональное CV.">
<link rel="canonical" href="https://rukc2006.github.io/Porttfolio/artist.html">
<title>Ксения Комарова · Художница</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1d1b;color:#e7e6dc;font-family:Arial,sans-serif}.artist-tabs{height:58px;display:flex;justify-content:center;align-items:center;gap:10px;padding:7px 14px;background:#0b1d1b;border-bottom:1px solid rgba(226,221,202,.18)}.artist-tab{appearance:none;border:1px solid rgba(226,221,202,.22);border-radius:999px;background:transparent;color:#b6c2b8;padding:10px 26px;font:500 12px/1.2 Arial,sans-serif;letter-spacing:.03em;cursor:pointer}.artist-tab:hover{border-color:#d58c73;color:#e7e6dc}.artist-tab[aria-selected=true]{background:#c77d67;border-color:#c77d67;color:#10211e}.panel{height:calc(100% - 58px);width:100%}.panel[hidden]{display:none!important}iframe{display:block;width:100%;height:100%;border:0;background:#0c1d1b}@media(max-width:680px){.artist-tabs{height:52px;gap:8px;padding:6px}.artist-tab{padding:9px 18px;font-size:11px}.panel{height:calc(100% - 52px)}}
</style>
</head>
<body>
<div class="artist-tabs" role="tablist" aria-label="Страницы художницы">
<button class="artist-tab" id="tab-view" type="button" role="tab" aria-selected="true" aria-controls="panel-view" data-tab="view">Мой взгляд</button>
<button class="artist-tab" id="tab-cv" type="button" role="tab" aria-selected="false" aria-controls="panel-cv" data-tab="cv" tabindex="-1">CV художницы</button>
</div>
<section class="panel" id="panel-view" role="tabpanel" aria-labelledby="tab-view"><iframe title="Авторская презентация художницы" src="artist-view.html"></iframe></section>
<section class="panel" id="panel-cv" role="tabpanel" aria-labelledby="tab-cv" hidden><iframe title="Прежняя страница художницы и CV" data-src="artist-cv.html"></iframe></section>
<script>
const tabs=[...document.querySelectorAll('[data-tab]')],panels={view:document.getElementById('panel-view'),cv:document.getElementById('panel-cv')};
function selectTab(name,writeHash=true){if(!panels[name])return;tabs.forEach(t=>{const on=t.dataset.tab===name;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1});Object.entries(panels).forEach(([key,p])=>p.hidden=key!==name);if(name==='cv'){const f=panels.cv.querySelector('iframe');if(!f.src)f.src=f.dataset.src}if(writeHash)history.replaceState(null,'',location.pathname+location.search+(name==='cv'?'#cv':'#view'))}
tabs.forEach(t=>t.addEventListener('click',()=>selectTab(t.dataset.tab)));tabs.forEach(t=>t.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=tabs.indexOf(t),n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[n].focus();selectTab(tabs[n].dataset.tab)}));window.addEventListener('hashchange',()=>{if(location.hash==='#cv')selectTab('cv',false);else if(location.hash==='#view')selectTab('view',false)});if(location.hash==='#cv')selectTab('cv',false);
</script>
</body>
</html>
