<script>
const tabs=[...document.querySelectorAll('[data-tab]')],panels={view:document.getElementById('panel-view'),cv:document.getElementById('panel-cv')};
const tabNames={ru:{view:'Мой взгляд',cv:'CV художницы'},en:{view:'My perspective',cv:'Artist CV'},zh:{view:'我的视角',cv:'艺术家履历'}};
function syncTabLanguage(lang){const names=tabNames[lang]||tabNames.ru;tabs.forEach(t=>t.textContent=names[t.dataset.tab]);document.documentElement.lang=lang==='zh'?'zh-CN':lang}
try{syncTabLanguage(localStorage.getItem('kc_lang')||'ru')}catch(e){syncTabLanguage('ru')}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.type==='kc-language-change')syncTabLanguage(e.data.lang)});
function selectTab(name,writeHash=true){if(!panels[name])return;tabs.forEach(t=>{const on=t.dataset.tab===name;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1});Object.entries(panels).forEach(([key,p])=>p.hidden=key!==name);if(name==='cv'){const f=panels.cv.querySelector('iframe');if(f.getAttribute('src')===null)f.setAttribute('src',f.dataset.src)}if(writeHash)history.replaceState(null,'',location.pathname+location.search+(name==='cv'?'#cv':'#view'))}
tabs.forEach(t=>t.addEventListener('click',()=>selectTab(t.dataset.tab)));tabs.forEach(t=>t.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=tabs.indexOf(t),n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[n].focus();selectTab(tabs[n].dataset.tab)}));window.addEventListener('hashchange',()=>{if(location.hash==='#cv')selectTab('cv',false);else if(location.hash==='#view')selectTab('view',false)});if(location.hash==='#cv')selectTab('cv',false);
</script>
