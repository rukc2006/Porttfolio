<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Витрина — Мастерская-Колыбель</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500&display=swap');
:root{--bg:#101710;--bg2:#172018;--paper:#f1eadb;--muted:#b7ad98;--gold:#b69a68;--line:rgba(233,223,201,.18)}
:root[data-theme="light"]{--bg:#eee8dc;--bg2:#e4ddce;--paper:#273126;--muted:#687063;--gold:#8a7040;--line:rgba(39,49,38,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:300 15px/1.7 Manrope,system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 48px));margin:auto;padding:55px 0 90px}a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.back{font-size:12px;color:var(--muted)}.theme-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}.theme-btn:hover{color:var(--paper);border-color:var(--gold)}h1{font:500 clamp(52px,7vw,88px)/.98 'Cormorant Garamond',serif;margin:70px 0 16px}.intro{max-width:700px;color:var(--muted);margin-bottom:50px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid var(--line);background:rgba(255,255,255,.02);overflow:hidden}.card img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}.caption{padding:15px;color:var(--muted);font-size:12px}.empty{border:1px solid var(--line);padding:30px;color:var(--muted)}.empty a{color:var(--gold)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.wrap{width:min(100% - 28px,1180px)}.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style>
<script>
(function(){const k='kcradle-theme';function apply(m){document.documentElement.dataset.theme=m;const b=document.getElementById('themeBtn');if(b)b.textContent=m==='light'?'Тёмная тема':'Светлая тема'}function init(){let m='dark';try{m=localStorage.getItem(k)||'dark'}catch(e){}apply(m);const b=document.getElementById('themeBtn');if(b)b.onclick=()=>{m=m==='light'?'dark':'light';try{localStorage.setItem(k,m)}catch(e){}apply(m)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();
</script>
</head>
<body><main class="wrap">
<div class="top"><a class="back" href="../Kcradle.html">← Мастерская-Колыбель</a><button id="themeBtn" class="theme-btn" type="button">Светлая тема</button></div>
<h1>Витрина работ</h1>
<p class="intro">Здесь постепенно собираются работы Мастерской-Колыбель. Новые изображения появляются в витрине по мере обновления портфолио.</p>
<div id="status" class="empty">Загружаю работы…</div><div id="grid" class="grid"></div>
</main>
<script>
const owner='rukc2006',repo='Porttfolio',path='works';
const imageExt=/\.(png|jpe?g|webp|gif|avif)$/i;
async function load(){
 const status=document.getElementById('status'),grid=document.getElementById('grid');
 try{
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{headers:{Accept:'application/vnd.github+json'}});
  if(!r.ok)throw new Error();
  const files=await r.json();
  const imgs=files.filter(x=>x.type==='file'&&imageExt.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  if(!imgs.length){status.textContent='Витрина пока пуста. Новые работы появятся здесь по мере обновления мастерской.';return;}
  status.remove();
  for(const f of imgs){
   const card=document.createElement('a');card.className='card';card.href=f.html_url;card.target='_blank';card.rel='noopener';
   const img=document.createElement('img');img.loading='lazy';img.src=f.download_url;img.alt=f.name.replace(/\.[^.]+$/,'');
   const cap=document.createElement('div');cap.className='caption';cap.textContent=f.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ');
   card.append(img,cap);grid.appendChild(card);
  }
 }catch(e){status.textContent='Витрина обновляется вместе с портфолио. Откройте её позже, чтобы увидеть новые работы.';}
}
load();
</script></body></html>
